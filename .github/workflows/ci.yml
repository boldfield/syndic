name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: go build ./...
      - run: go vet ./...
      - run: go test -timeout 5m ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Host-pane acceptance (tmux)
        run: SYNDIC_TMUX_TEST=1 go test -count=1 -timeout 5m -run TestTMUX_EndToEnd -v ./internal/acceptance/
