name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check design document immutability
        run: bash scripts/check-design-immutability.sh
      - run: make fmt-check
      - run: go build ./...
      - run: go vet ./...
      - name: Cross-build for macOS
        run: GOOS=darwin GOARCH=arm64 go build ./... && GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go test -timeout 5m ./...
      - name: Sandbox enforcement (linux-namespaces)
        run: |
          # Ubuntu's AppArmor restricts unprivileged user namespaces; lift
          # the restriction where the key exists.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          SYNDIC_SANDBOX_TEST=1 go test -count=1 -timeout 5m -run TestLinuxNamespacesEnforcement -v ./internal/sandbox/
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Host-pane acceptance (tmux)
        run: SYNDIC_TMUX_TEST=1 go test -count=1 -timeout 5m -run TestTMUX_EndToEnd -v ./internal/acceptance/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Runner
        run: sw_vers && uname -m && csrutil status || true
      - run: go build ./...
      - name: Unit tests (sandbox, command)
        run: |
          # internal/command is tested here once it exists.
          pkgs="./internal/sandbox/..."
          if [ -d internal/command ]; then pkgs="$pkgs ./internal/command/..."; fi
          go test -count=1 -timeout 5m $pkgs
      - name: Sandbox enforcement (macos-sandbox-exec)
        run: SYNDIC_SANDBOX_TEST=1 go test -count=1 -timeout 5m -run TestMacOSSandboxExecEnforcement -v ./internal/sandbox/
